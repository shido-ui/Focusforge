[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="focusforge-backend"
version="0.1.0"
requires-python=">=3.12,<3.13"
dependencies=["fastapi>=0.116,<1","uvicorn[standard]>=0.35,<1","sqlalchemy>=2,<3","alembic>=1.16,<2","pydantic>=2.11,<3","pydantic-settings>=2.10,<3","argon2-cffi>=25,<26","PyJWT>=2.10,<3","email-validator>=2.3,<3"]
[project.optional-dependencies]
test=["pytest>=8.4,<9","httpx>=0.28,<1"]
[tool.hatch.build.targets.wheel]
packages=["app"]
