name: FocusForge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusforge-ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FOCUSFORGE_ENV: test
      FOCUSFORGE_DATABASE_URL: sqlite:///./focusforge-ci.db
      FOCUSFORGE_JWT_SECRET: ci-test-secret-0123456789-0123456789
      FOCUSFORGE_ACCESS_TOKEN_MINUTES: 15
      FOCUSFORGE_REFRESH_TOKEN_DAYS: 30
      FOCUSFORGE_CORS_ORIGINS: http://localhost,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Clean test database
        run: rm -f focusforge-ci.db focusforge-ci.db-shm focusforge-ci.db-wal
      - name: Upgrade database
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest -q

  android:
    runs-on: ubuntu-latest
    env:
      RELEASE_API_BASE_URL: \${{ vars.FOCUSFORGE_RELEASE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Require release endpoint configuration
        shell: bash
        run: |
          if [[ -z "$RELEASE_API_BASE_URL" ]]; then
            echo "Missing repository variable FOCUSFORGE_RELEASE_API_BASE_URL."
            exit 1
          fi
          if [[ "$RELEASE_API_BASE_URL" != https://* ]]; then
            echo "FOCUSFORGE_RELEASE_API_BASE_URL must use HTTPS."
            exit 1
          fi
      - name: Build and lint Android
        working-directory: android
        run: |
          gradle testDebugUnitTest assembleDebug assembleRelease lintDebug --stacktrace \
            -PfocusforgeApiBaseUrlRelease="$RELEASE_API_BASE_URL"
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusforge-android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  p0-kiosk-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build P0 kiosk proof
        working-directory: p0/android-kiosk-proof
        run: gradle assembleDebug --stacktrace
      - name: Upload P0 proof APK
        uses: actions/upload-artifact@v4
        with:
          name: focusforge-p0-kiosk-proof
          path: p0/android-kiosk-proof/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
