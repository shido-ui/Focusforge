name: FocusForge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - run: alembic upgrade head
        env:
          FOCUSFORGE_JWT_SECRET: ci-test-secret-0123456789-0123456789
      - run: pytest -q
        env:
          FOCUSFORGE_JWT_SECRET: ci-test-secret

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build and lint Android
        working-directory: android
        run: gradle assembleDebug assembleRelease lintDebug --stacktrace
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusforge-android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
